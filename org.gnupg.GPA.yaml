app-id: org.gnupg.GPA
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: gpa
rename-desktop-file: gpa.desktop
rename-icon: gpa
finish-args:
  - --share=ipc
  - --socket=x11
  #- --filesystem=~/.gnupg:rw
  #- --filesystem=xdg-run/gnupg:rw
  - --filesystem=host
  - --filesystem=/tmp

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/info
  - /share/man

modules:

  - shared-modules/gtk2/gtk2.json

  - name: pinentry
    buildsystem: autotools
    config-opts:
      - --enable-maintainer-mode  # Fails on compiling docs if omitted
      - --enable-pinentry-gtk2    # Only enable the GTK2 prompt, disable the rest
      - --disable-ncurses
      - --disable-fallback-curses
      - --disable-pinentry-curses
      - --disable-pinentry-emacs
      - --disable-pinentry-fltk
      - --disable-pinentry-gnome3
      - --disable-pinentry-qt5
      - --disable-pinentry-tqt
      - --disable-pinentry-tty
    sources:
      - type: archive
        url: https://gnupg.org/ftp/gcrypt/pinentry/pinentry-1.3.2.tar.bz2
        sha256: 8e986ed88561b4da6e9efe0c54fa4ca8923035c99264df0b0464497c5fb94e9e

  - name: gpa
    buildsystem: autotools
    post-install:
      - install -Dm644 gpa.png -t ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
      - desktop-file-edit --set-name="GPA" /app/share/applications/gpa.desktop
    sources:
      - type: archive
        url: https://www.gnupg.org/ftp/gcrypt/gpa/gpa-0.11.1.tar.bz2
        sha256: 0bc5b2cd3e0641d07a2d8af372a09659decd918bee22fdfbefd2133d7c4d5d0b
      - type: file
        path: gpa.png
      - type: file
        path: org.gnupg.GPA.metainfo.xml
